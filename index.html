<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWT MindFlow 身心智慧學院</title>
<meta name="description" content="電影質感的身心智慧學院主畫面：光束、柔光暈、飛鳥與櫻花、雲海外圍、明亮的夜晚村莊。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--glass1:rgba(30,56,112,.62);--glass2:rgba(14,28,66,.68);--gold:#f4cf73;--ink:#fff;--muted:#c9d6f2;color-scheme:dark}
  html,body{height:100%;margin:0;background:#eef2f7;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#cfe0f2 center/cover no-repeat}
  #stage.dragging{cursor:grabbing}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .6s}
  #gl.live{opacity:1}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  svg{width:100%;height:100%;display:block}
  .glass{background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid rgba(255,226,150,.55);
    box-shadow:0 8px 28px rgba(8,18,48,.35),inset 0 1px 0 rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .hud{position:fixed;z-index:4}
  :root{--u:0.64px}

  /* ───── 操作介面（HUD）─────
     以設計稿 2000×1125 的像素為單位繪製，執行時依畫面大小等比例縮放並貼齊各自的角落。
     介面與場景圖完全分開：日後更換或擴充場景，介面的位置與比例都不會改變。
     字型：中文標題與按鈕用粉圓體（Huninn），英文與數字用 Fredoka，內文用 Noto Sans TC。 */
  :root{--round:"Huninn","Noto Sans TC",sans-serif;--fun:"Fredoka","Huninn","Noto Sans TC",sans-serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --gold-rim:0 0 0 1.5px rgba(255,218,140,.75),0 0 0 3px rgba(96,62,12,.55);--gloss:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -12px 20px rgba(0,0,0,.28)}
  .hud-el{position:fixed;left:0;top:0;transform-origin:0 0;z-index:4;pointer-events:none;font-family:var(--body);color:#fff}
  .hud-el button{pointer-events:auto;-webkit-tap-highlight-color:transparent}
  .hud-el img{display:block;pointer-events:none;-webkit-user-drag:none}
  .abs{position:absolute}
  .gloss::before{content:"";position:absolute;left:6%;right:6%;top:3px;height:42%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none}

  /* 玩家卡 */
  #h-player .panel{left:46px;top:8px;width:356px;height:104px;border-radius:22px 46px 32px 22px;
    background:linear-gradient(180deg,rgba(70,104,178,.96) 0%,rgba(40,66,132,.96) 46%,rgba(22,38,90,.97) 100%);
    box-shadow:var(--gold-rim),var(--gloss),0 12px 26px rgba(4,12,40,.5)}
  #h-player .ring{left:2px;top:-2px;width:122px;height:122px;border-radius:50%;padding:6px;box-sizing:border-box;
    background:conic-gradient(from 210deg,#fff4c6,#f0bd4c,#a5640d,#ffe39a,#e7ac36,#fff4c6);box-shadow:0 0 0 2px rgba(90,56,10,.7),0 0 20px rgba(255,206,110,.75);animation:ringGlow 3.6s ease-in-out infinite}
  #h-player .ring img{width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}
  #h-player .name{left:150px;top:13px;font:600 33px/1 var(--fun);letter-spacing:.01em;text-shadow:0 2px 0 rgba(10,24,70,.55),0 0 12px rgba(120,180,255,.35)}
  #h-player .rank{left:150px;top:52px;font:400 21px/1 var(--fun);letter-spacing:.02em;white-space:nowrap;color:#e6efff}
  #h-player .badge{left:330px;top:26px;width:38px;height:38px;filter:drop-shadow(0 0 7px rgba(255,210,120,.75));animation:bob 3s ease-in-out infinite}
  #h-player .xp{left:148px;top:82px;width:208px;height:22px;border-radius:11px;background:linear-gradient(180deg,rgba(4,10,32,.95),rgba(16,28,64,.95));overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1.5px rgba(150,190,255,.35)}
  #h-player .xp i{position:absolute;left:0;top:0;bottom:0;width:75%;border-radius:11px;background:linear-gradient(180deg,#6fc1ff 0%,#2f86ff 45%,#1d5ee8 100%);box-shadow:0 0 10px rgba(80,160,255,.8)}
  #h-player .xp i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:shine 3.2s linear infinite}
  #h-player .xp b{position:relative;display:block;text-align:center;font:600 16px/22px var(--fun);letter-spacing:.04em;text-shadow:0 1px 2px rgba(0,0,0,.6)}

  /* 標題 */
  #h-title .dome{left:35px;top:0;width:350px;height:232px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
  #h-title .dome i{position:absolute;left:0;top:8px;width:350px;height:350px;border-radius:50%;box-sizing:border-box;
    background:radial-gradient(circle at 50% 30%,rgba(80,128,206,.85),rgba(30,62,132,.88) 55%,rgba(16,36,90,.9) 75%);
    box-shadow:inset 0 0 0 2px rgba(255,220,150,.5),inset 0 0 0 5px rgba(120,170,255,.25),inset 0 0 40px rgba(150,200,255,.35)}
  #h-title .logo{left:159px;top:12px;width:102px;height:54px;filter:drop-shadow(0 0 10px rgba(255,210,110,.7));animation:bob 4s ease-in-out infinite}
  #h-title .en{left:0;right:0;top:64px;text-align:center;font:600 40px/1 var(--fun);letter-spacing:.01em;text-shadow:0 2px 0 rgba(8,22,70,.6),0 0 16px rgba(130,190,255,.55)}
  #h-title h1{left:-40px;right:-40px;top:106px;margin:0;text-align:center;white-space:nowrap;font:400 70px/1.1 var(--round);letter-spacing:5px;
    background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%),linear-gradient(180deg,#fff8d6 0%,#ffdc72 38%,#f3ad2e 68%,#c27610 100%);
    background-size:300% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.4px rgba(120,66,6,.55);
    filter:drop-shadow(0 4px 0 #6a3d07) drop-shadow(0 0 14px rgba(255,200,90,.6));animation:titleShine 7s ease-in-out infinite}
  #h-title .sub{left:-20px;right:-20px;top:188px;text-align:center;white-space:nowrap;font:400 24px/1 var(--round);letter-spacing:.14em;color:#f2f6ff;text-shadow:0 2px 0 rgba(8,22,70,.7),0 0 10px rgba(120,180,255,.45)}

  /* 右上功能鍵 */
  #h-nav{display:flex;gap:14px}
  #h-nav button{position:relative;flex:none;width:76px;height:90px;border-radius:38px 38px 18px 18px;box-sizing:border-box;
    background:linear-gradient(180deg,#5682d0 0%,#3159a6 44%,#1d3a7c 100%);box-shadow:var(--gold-rim),var(--gloss),0 8px 16px rgba(4,14,44,.5);
    transition:transform .22s cubic-bezier(.3,1.6,.5,1),filter .2s,box-shadow .2s}
  #h-nav button:hover{transform:translateY(-4px);box-shadow:var(--gold-rim),var(--gloss),0 0 18px rgba(255,214,120,.7),0 12px 18px rgba(4,14,44,.5)}
  #h-nav .ico{position:absolute;left:14px;top:5px;width:48px;height:48px;filter:drop-shadow(0 0 6px rgba(255,214,120,.65)) drop-shadow(0 2px 1px rgba(60,30,0,.6));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  #h-nav button:hover .ico{transform:scale(1.1) rotate(-4deg)}
  #h-nav span{position:absolute;left:-6px;right:-6px;bottom:-3px;height:36px;border-radius:18px;background:linear-gradient(180deg,#3d64b0,#1f3b78);
    box-shadow:0 0 0 1.5px rgba(255,218,140,.55),inset 0 1px 0 rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.35);font:400 17px/36px var(--round);text-align:center;white-space:nowrap;letter-spacing:.02em}

  /* 今日任務 */
  #h-tasks .panel{left:6px;top:16px;width:346px;height:186px;border-radius:26px;
    background:linear-gradient(180deg,rgba(56,78,132,.93) 0%,rgba(32,48,92,.94) 50%,rgba(20,30,64,.95) 100%);
    box-shadow:0 0 0 1.5px rgba(140,205,255,.75),0 0 0 3px rgba(20,40,90,.6),0 0 22px rgba(90,170,255,.45),var(--gloss),0 12px 24px rgba(4,12,40,.45)}
  #h-tasks .star{left:6px;top:-2px;width:76px;height:76px;animation:starPulse 3s ease-in-out infinite}
  #h-tasks h2{left:94px;top:26px;margin:0;font:400 27px/1 var(--round);color:#ffe9ad;letter-spacing:.08em;text-shadow:0 2px 0 rgba(80,40,0,.5),0 0 12px rgba(255,200,100,.55)}
  #h-tasks hr{left:24px;right:18px;top:62px;margin:0;border:0;height:2px;background:linear-gradient(90deg,rgba(255,215,130,0),rgba(255,215,130,.95) 15%,rgba(255,215,130,.15))}
  #h-tasks ul{left:18px;right:14px;top:72px;margin:0;padding:0;list-style:none}
  #h-tasks li{display:flex;align-items:center;height:37px;margin-bottom:2px;padding:0 8px;border-radius:12px;font:500 19px/1 var(--body);white-space:nowrap;transition:background .2s}
  #h-tasks li:hover{background:rgba(255,255,255,.07)}
  #h-tasks li svg{width:25px;height:25px;flex:none;margin-right:12px;filter:drop-shadow(0 0 4px rgba(120,190,255,.6))}
  #h-tasks li b{margin-left:auto;width:70px;height:27px;border-radius:14px;background:linear-gradient(180deg,rgba(4,10,30,.9),rgba(14,24,54,.9));box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(150,190,255,.3);
    font:600 18px/27px var(--fun);letter-spacing:.04em;text-align:center}

  /* 底部功能鈕 */
  #h-actions .stage{left:6px;top:22px;width:936px;height:102px;border-radius:50%;box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,214,120,.16),rgba(80,52,16,.32) 72%);
    box-shadow:0 0 0 3px rgba(255,212,120,.85),0 0 0 5px rgba(110,70,14,.5),0 0 30px rgba(255,190,90,.75),inset 0 0 34px rgba(255,190,90,.5);animation:stageGlow 4s ease-in-out infinite}
  #h-actions button{position:absolute;top:0;width:132px;height:120px;transition:transform .22s cubic-bezier(.3,1.6,.5,1),filter .2s}
  #h-actions button:hover{transform:translateY(-6px);filter:brightness(1.1)}
  #h-actions .dome{left:4px;right:4px;top:0;height:106px;border-radius:62px 62px 30px 30px;
    background:radial-gradient(circle at 50% 28%,rgba(96,82,66,.96),rgba(40,32,24,.97) 62%,rgba(20,16,12,.98));
    box-shadow:0 0 0 3px #f2c75e,0 0 0 5px rgba(104,66,12,.9),0 0 0 6.5px rgba(255,226,150,.55),0 0 22px rgba(255,196,90,.6),inset 0 3px 10px rgba(255,236,190,.28),inset 0 -14px 22px rgba(0,0,0,.5);transition:box-shadow .2s}
  #h-actions button:hover .dome{box-shadow:0 0 0 3px #ffd877,0 0 0 5px rgba(104,66,12,.9),0 0 0 6.5px rgba(255,236,170,.8),0 0 34px rgba(255,206,110,.95),inset 0 3px 10px rgba(255,236,190,.35),inset 0 -14px 22px rgba(0,0,0,.45)}
  #h-actions .ico{position:absolute;left:31px;top:5px;width:70px;height:70px;filter:drop-shadow(0 0 8px rgba(255,210,110,.65)) drop-shadow(0 2px 1px rgba(60,30,0,.6));animation:bob 3.4s ease-in-out infinite}
  #h-actions button:nth-of-type(2) .ico{animation-delay:-.7s} #h-actions button:nth-of-type(3) .ico{animation-delay:-1.4s}
  #h-actions button:nth-of-type(4) .ico{animation-delay:-2.1s} #h-actions button:nth-of-type(5) .ico{animation-delay:-2.8s}
  #h-actions span.lab{position:absolute;left:-6px;right:-6px;bottom:0;height:44px;border-radius:22px;box-sizing:border-box;
    background:linear-gradient(180deg,rgba(78,66,56,.97),rgba(34,28,22,.98));box-shadow:0 0 0 1.5px rgba(255,215,140,.55),inset 0 1px 0 rgba(255,240,210,.3),0 4px 8px rgba(0,0,0,.45);
    font:400 24px/44px var(--round);letter-spacing:.06em;text-align:center;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.55)}

  /* 標語 */
  #h-slogan .glow{left:0;top:0;right:0;bottom:0;border-radius:50%;background:radial-gradient(ellipse at 45% 50%,rgba(18,46,118,.62),rgba(18,46,118,0) 70%)}
  #h-slogan p{left:0;width:410px;top:20px;margin:0;text-align:center;font:400 26px/1.45 var(--round);letter-spacing:.06em;
    text-shadow:0 0 10px rgba(110,185,255,.95),0 0 2px #fff,0 2px 4px rgba(0,10,40,.6)}
  #h-slogan .feather{right:0;top:36px;width:44px;height:76px;filter:drop-shadow(0 0 8px rgba(255,220,140,.7));animation:bob 4.4s ease-in-out infinite}
  #h-slogan svg{position:absolute;left:0;bottom:0;width:435px;height:56px;overflow:visible}

  /* 待機小動畫 */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
  @keyframes titleShine{0%,62%{background-position:130% 0,0 0}100%{background-position:-130% 0,0 0}}
  @keyframes ringGlow{0%,100%{box-shadow:0 0 0 2px rgba(90,56,10,.7),0 0 16px rgba(255,206,110,.6)}50%{box-shadow:0 0 0 2px rgba(90,56,10,.7),0 0 28px rgba(255,214,120,.95)}}
  @keyframes starPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(255,214,120,.7))}50%{filter:drop-shadow(0 0 16px rgba(255,226,150,1))}}
  @keyframes stageGlow{0%,100%{opacity:.88}50%{opacity:1}}

  /* 按鈕點擊動畫：按下時壓縮，放開時彈跳，並在點擊位置放出金色光波、光環與星點 */
  .hud-el button.is-down,.zoom button.is-down,.home.is-down,.seg button.is-down,.toggle.is-down,.reset.is-down{transform:translateY(2px) scale(.88) !important;filter:brightness(.9) !important;transition:transform .08s ease-out,filter .08s}
  .hud-el button.pop,.zoom button.pop,.seg button.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{0%{transform:scale(.88)}35%{transform:scale(1.12)}60%{transform:scale(.96)}80%{transform:scale(1.03)}100%{transform:scale(1)}}
  #fx-layer{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
  .fx-ripple,.fx-shock,.fx-spark{position:absolute;pointer-events:none;border-radius:50%}
  .fx-ripple{background:radial-gradient(circle,rgba(255,255,240,1) 0%,rgba(255,226,140,.85) 28%,rgba(255,190,80,.4) 50%,rgba(255,190,80,0) 70%);mix-blend-mode:screen;transform:translate(-50%,-50%) scale(.15);animation:ripple .65s cubic-bezier(.2,.8,.3,1) forwards}
  .fx-shock{border:4px solid #ffe7a6;box-shadow:0 0 16px 2px rgba(255,200,90,.95),inset 0 0 12px rgba(255,210,110,.85);transform:translate(-50%,-50%) scale(.5);animation:shock .6s cubic-bezier(.2,.8,.3,1) forwards}
  .fx-shock.s2{border-width:2px;animation-delay:.08s;opacity:0;animation-name:shock2}
  .fx-spark{width:16px;height:16px;border-radius:0;background:radial-gradient(circle,#fffbe8 0%,#ffd45e 45%,#f29a1c 100%);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    filter:drop-shadow(0 0 2px #7a4300) drop-shadow(0 0 6px rgba(255,190,70,1));transform:translate(-50%,-50%) scale(1.2);animation:spark .8s cubic-bezier(.15,.75,.3,1) forwards}
  @keyframes ripple{0%{opacity:1}60%{opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  @keyframes shock{0%{opacity:1}55%{opacity:.85}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
  @keyframes shock2{0%{opacity:.9;transform:translate(-50%,-50%) scale(.6)}100%{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
  @keyframes spark{0%{opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(180deg);opacity:0}}
  .hud-el button.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1),flash .45s ease-out}
  @keyframes flash{0%{filter:brightness(1.7) saturate(1.2)}100%{filter:brightness(1)}}
  @media (prefers-reduced-motion:reduce){.hud-el *,.hud-el{animation:none !important}}

  #plates{position:fixed;inset:0;pointer-events:none;z-index:3}
  .plate{position:absolute;display:flex;align-items:center;justify-content:center;gap:.3em;border-radius:.42em;transform:scale(1);transition:transform .25s,box-shadow .25s,filter .25s;box-sizing:border-box;
    background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.18)),var(--c);border:1.5px solid rgba(255,226,150,.9);color:#fff;white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .sfog{position:absolute;display:none;transform:translate(-50%,-50%);padding:.25em .9em .25em .35em;border-radius:999px;white-space:nowrap;pointer-events:none;
    font:400 1em/1.3 var(--round);color:#fff;letter-spacing:.08em;background:rgba(20,34,72,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    box-shadow:0 0 0 1px rgba(255,226,150,.55),0 0 14px rgba(150,190,255,.45);text-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s;animation:fogPulse 3.2s ease-in-out infinite}
  .sfog b{display:inline-block;min-width:1.5em;margin-right:.45em;border-radius:999px;font:600 .9em/1.5em var(--fun);text-align:center;background:rgba(255,255,255,.18);color:#fff}
  .sfog.show{display:block}
  .sfog.on{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 1.5px #ffe7a2,0 0 20px rgba(255,206,110,.8)}
  @keyframes fogPulse{0%,100%{opacity:.82}50%{opacity:1}}
  .plate.fogged{filter:saturate(.3) brightness(.9)}
  .plate.fogged::after{content:"未探索";position:absolute;right:-.3em;top:-.9em;padding:.1em .5em;border-radius:999px;font:400 .42em/1.4 var(--round);color:#3b2304;background:#f2c75e;box-shadow:0 0 8px rgba(255,206,110,.8)}
  .plate.on{transform:scale(1.14);filter:brightness(1.12);box-shadow:0 0 16px rgba(255,220,140,.7),0 6px 18px rgba(0,0,0,.35)}
  .plate i{width:1.25em;height:1.25em;flex:none;border-radius:50%;padding:.18em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45)}
  .plate span{display:grid;line-height:1.1;text-align:left}
  .plate b{font:400 1em/1.1 var(--round);letter-spacing:.08em}
  .plate small{font:500 .5em/1.1 var(--fun);opacity:.92;letter-spacing:.02em}

  .tools{z-index:5;right:calc(var(--u) * 32);top:calc(var(--u) * 140);padding:7px 13px;border-radius:14px;font-size:13.5px}
  .toggle{display:block;width:100%;text-align:left;color:var(--gold);letter-spacing:.04em;font-family:var(--round);position:relative}
  .tools .body{display:none;width:250px;padding-top:8px;max-height:calc(100vh - 200px);overflow:auto}
  .tools.open .body{display:block}
  .tools p{margin:0 0 8px;color:var(--muted);font-size:12px;line-height:1.55}
  .tools label{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer}
  .tools input{accent-color:#f1cd78;width:16px;height:16px;margin:0}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 2px}
  .gfx{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,226,150,.3)}
  .gfx h4{margin:0 0 6px;font:400 15px/1.3 var(--round);color:var(--gold);letter-spacing:.06em}
  .tools label.rng{display:grid;grid-template-columns:48px 1fr 32px;align-items:center;gap:8px;padding:5px 2px}
  .rng span{font-size:13px}
  .rng output{font:600 13px/1 var(--fun);text-align:right;color:#fff2c8}
  .tools .rng input{width:100%;height:18px;accent-color:#f1cd78;cursor:pointer}
  .qlabel{font-size:13px;margin-top:6px}
  .gfx .qhint{margin:6px 0 0;font-size:11.5px}
  .reset{margin-top:8px;width:100%;padding:7px 0;border-radius:8px;font:400 13px/1 var(--round);background:rgba(255,255,255,.08);border:1px solid rgba(255,226,150,.4);color:#fff2c8;position:relative}

  .enter{position:relative;flex:1;height:46px;border-radius:23px;font:400 19px/46px var(--round);letter-spacing:.12em;color:#3b2304;
    background:linear-gradient(180deg,#fff3c2 0%,#ffd468 45%,#e9a22a 100%);box-shadow:0 0 0 2px #fff0bf inset,0 0 0 2px #8a5410,0 0 18px rgba(255,200,90,.7),0 4px 10px rgba(0,0,0,.35);
    transition:transform .2s cubic-bezier(.3,1.6,.5,1),filter .2s;animation:enterGlow 2.2s ease-in-out infinite}

  .stag.on{transform:translateX(-50%) scale(1.08);box-shadow:0 0 0 2px #ffe7a2,0 0 16px rgba(255,206,110,.85)}
  /* 場景轉場 */
  #warp{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,1) 0%,rgba(255,244,214,.96) 35%,rgba(255,226,160,.85) 60%,rgba(200,220,255,.6) 100%)}

  #h-back{display:none}
  .in-village #h-back{display:block}
  /* 村莊場景的標題名牌畫在場景圖上（覺察之門、認知覺醒），不另外疊介面標題 */
  .in-village #h-title{display:none}
  .in-village .home{top:calc(var(--u) * 175)}
  .portrait #h-back{transform-origin:0 0}
  .card .next{font-size:12.5px;color:var(--muted);border-top:1px solid rgba(255,255,255,.15);padding-top:8px;margin:0}
  .toast{font-family:var(--round);left:50%;top:calc(var(--u) * 250);transform:translate(-50%,-8px);padding:9px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:7;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .fallback{position:fixed;left:50%;top:calc(var(--u,0.64px) * 250);transform:translateX(-50%);z-index:20;max-width:min(560px,calc(100% - 32px));padding:14px 18px;border-radius:14px;
    font:400 14px/1.6 "Noto Sans TC",sans-serif;color:#fff;background:rgba(14,28,66,.9);border:1px solid rgba(255,226,150,.6);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .fallback b{color:#ffe08a}

  /* 收起操作介面：所有介面往畫面外淡出，只留下一顆切換按鈕 */
  .hud-el,.tools,.zoom,.slogan-x{transition:opacity .45s ease,translate .5s cubic-bezier(.4,0,.2,1),visibility 0s linear 0s}
  .hud-hidden .hud-el,.hud-hidden .tools,.hud-hidden .zoom{opacity:0 !important;visibility:hidden;pointer-events:none !important;
    transition:opacity .45s ease,translate .5s cubic-bezier(.4,0,.2,1),visibility 0s linear .5s}
  .hud-hidden #h-player,.hud-hidden #h-title,.hud-hidden #h-nav,.hud-hidden #h-back,.hud-hidden .tools,.hud-hidden .zoom{translate:0 -40px}
  .hud-hidden #h-tasks,.hud-hidden #h-actions,.hud-hidden #h-slogan{translate:0 40px}
  #hud-toggle{position:fixed;z-index:7;right:calc(var(--u) * 32);bottom:calc(var(--u) * 190);width:46px;height:46px;border-radius:50%;padding:11px;box-sizing:border-box;color:#ffe08a;
    background:linear-gradient(180deg,rgba(70,104,178,.92),rgba(22,38,90,.94));box-shadow:0 0 0 1.5px rgba(255,218,140,.8),inset 0 2px 0 rgba(255,255,255,.3),0 6px 14px rgba(4,12,40,.5);
    transition:transform .22s cubic-bezier(.3,1.6,.5,1),opacity .3s,box-shadow .2s}
  #hud-toggle:hover{transform:scale(1.08);box-shadow:0 0 0 1.5px #ffe7a2,0 0 16px rgba(255,206,110,.75),0 6px 14px rgba(4,12,40,.5)}
  #hud-toggle svg{width:100%;height:100%}
  #hud-toggle .tip{position:absolute;right:56px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 12px;border-radius:10px;font:400 13px/1.3 var(--round);color:#fff;
    background:rgba(14,28,66,.85);border:1px solid rgba(255,226,150,.5);opacity:0;pointer-events:none;transition:opacity .2s}
  @media (hover:hover){#hud-toggle:hover .tip{opacity:1}}
  #hud-toggle:focus-visible .tip{opacity:1}
  .hud-hidden #hud-toggle{opacity:.55}
  .hud-hidden #hud-toggle:hover{opacity:1}
  .portrait #hud-toggle{right:10px;bottom:auto;top:calc(var(--u) * 175 + 64px)}
  /* 直向手機：介面比例放大，標題移到玩家卡下方，隱藏今日任務與標語 */
  .portrait #h-tasks,.portrait #h-slogan{display:none}
  .portrait .tools{top:auto;bottom:calc(var(--u) * 150 + 12px);right:10px}
  .portrait .zoom{top:auto;bottom:calc(var(--u) * 150 + 62px);right:10px}
  .portrait .home{top:calc(var(--u) * 420)}
  .portrait .card{top:auto;bottom:calc(var(--u) * 150 + 10px);right:10px;left:10px;width:auto;transform:translateY(20px)}
  .portrait .card.show{transform:none}
</style>
</head>
<body>

(function () {

  // ---------------------------------------------------------------- 畫質與色彩調節（設定記在這台裝置的瀏覽器）
  var QUALITY = { low: { scale: 0.6, cap: 1, hint: "低：解析度降低、關閉柔光暈，適合較舊的裝置。" },
    mid: { scale: 0.8, cap: 1.25, hint: "中：較省電，畫面略柔。" },
    high: { scale: 1, cap: 1.5, hint: "高：清晰與流暢的平衡。" },
    ultra: { scale: 1, cap: 2, hint: "超高：完整解析度，最清晰（需要較好的顯示卡）。" } };
  var GFX_DEFAULT = { bright: 100, contrast: 100, sat: 100, quality: "ultra" }, gfx = Object.assign({}, GFX_DEFAULT);
  try { var saved = JSON.parse(localStorage.getItem("mf-gfx") || "null"); if (saved && QUALITY[saved.quality]) gfx = Object.assign(gfx, saved); } catch (e) {}
  function saveGfx() { try { localStorage.setItem("mf-gfx", JSON.stringify(gfx)); } catch (e) {} }
  var GFX_INPUTS = { bright: "g-bright", contrast: "g-contrast", sat: "g-sat" };
  function syncGfxUI() {
    Object.keys(GFX_INPUTS).forEach(function (k) { var el = document.getElementById(GFX_INPUTS[k]); el.value = gfx[k]; el.nextElementSibling.textContent = gfx[k]; });
    document.querySelectorAll("#g-quality button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.q === gfx.quality)); });
    document.getElementById("g-qhint").textContent = QUALITY[gfx.quality].hint;
  }
  Object.keys(GFX_INPUTS).forEach(function (k) {
    document.getElementById(GFX_INPUTS[k]).addEventListener("input", function (e) { gfx[k] = +e.target.value; e.target.nextElementSibling.textContent = gfx[k]; saveGfx(); });
  });
  document.querySelectorAll("#g-quality button").forEach(function (b) {
    b.addEventListener("click", function () { gfx.quality = b.dataset.q; syncGfxUI(); saveGfx(); resize(); });
  });
  document.getElementById("g-reset").addEventListener("click", function () { gfx = Object.assign({}, GFX_DEFAULT); syncGfxUI(); saveGfx(); resize(); });
  syncGfxUI();

  var W = 1, H = 1;
  function resize() {
    var dpr = (window.devicePixelRatio || 1) * QUALITY[gfx.quality].scale; dpr = Math.max(0.5, Math.min(dpr, QUALITY[gfx.quality].cap));
    W = canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr)); H = canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));
    aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    var ratio = cam.fov / HOME_FOV; computeHomeFov(); cam.fov = Math.max(MIN_FOV, Math.min(HOME_FOV, HOME_FOV * ratio));
    freeTarget(RT.scene); freeTarget(RT.a); freeTarget(RT.b);
    RT.scene = makeTarget(W, H); RT.a = makeTarget(Math.max(1, W >> 2), Math.max(1, H >> 2)); RT.b = makeTarget(Math.max(1, W >> 2), Math.max(1, H >> 2));
  }
  window.addEventListener("resize", resize); resize(); cam.fov = HOME_FOV;

  function drawFull(prog) { attrib(prog.p, "a", fullBuf, 2); gl.drawArrays(gl.TRIANGLES, 0, 3); resetAttribs(); }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t0 = performance.now(), last = t0, SUN_DIR = norm(planePoint(SUN_PX[0], SUN_PX[1]));
  var glFrames = 0, glChecked = false;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    var t = reduce ? 0 : (now - t0) / 1000;
    if (fly) {
      var k = Math.min(1, (now - fly.start) / fly.dur), e = ease(k);
      cam.yaw = fly.from.yaw + (fly.to.yaw - fly.from.yaw) * e; cam.pitch = fly.from.pitch + (fly.to.pitch - fly.from.pitch) * e; cam.fov = fly.from.fov + (fly.to.fov - fly.from.fov) * e;
      var fc = clamped(cam); cam.yaw = fc.yaw; cam.pitch = fc.pitch;
      if (k >= 1) fly = null;
    } else if (pointers.size === 0) {
      cam.yaw += vel.yaw; cam.pitch += vel.pitch; vel.yaw *= 0.9; vel.pitch *= 0.9;
      var cc = clamped(cam); if (cc.yaw !== cam.yaw) vel.yaw = 0; if (cc.pitch !== cam.pitch) vel.pitch = 0; cam.yaw = cc.yaw; cam.pitch = cc.pitch;
    }
    Object.keys(fxNow).forEach(function (kk) { fxNow[kk] += (fx[kk] - fxNow[kk]) * Math.min(1, dt * 6); });
    var tt = targetTime(); dusk += (tt[0] - dusk) * Math.min(1, dt * 2.5); night += (tt[1] - night) * Math.min(1, dt * 2.5);

    var idleTarget = (!focus && !fly && pointers.size === 0 && now - lastInput > 6000 && !reduce && fx.grade) ? 1 : 0;
    idle += (idleTarget - idle) * Math.min(1, dt * (idleTarget ? 0.25 : 3));
    var view = { yaw: cam.yaw + idle * Math.sin(t * 0.05) * 1.6 * D2R, pitch: cam.pitch + idle * Math.sin(t * 0.07) * 0.4 * D2R,
      fov: cam.fov * (1 - idle * (0.035 + 0.02 * Math.sin(t * 0.04))) };
    var vcl = clamped(view); view.yaw = vcl.yaw; view.pitch = vcl.pitch;
    var VP = viewProj(view); lastVP = VP;

    updateScreen(VP); plateZoom = view.fov / HOME_FOV; measureHud();
    hover = focus || (lastMouse && pointers.size === 0 ? pick(lastMouse[0], lastMouse[1]) : null);
    stage.style.cursor = hover && !focus && pointers.size === 0 ? "pointer" : "";
    updatePlates();
    if (!scene.tex) return;

    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.scene.fb); gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
    gl.useProgram(P.fog.p);
    gl.uniform1f(P.fog.u.uTime, t); gl.uniform1f(P.fog.u.uDusk, dusk); gl.uniform1f(P.fog.u.uNight, night);
    var f = dirOf(view), r = norm(cross(f, [0, 1, 0])), up = cross(r, f);
    gl.uniform3fv(P.fog.u.uF, f); gl.uniform3fv(P.fog.u.uR, r); gl.uniform3fv(P.fog.u.uU, up);
    gl.uniform1f(P.fog.u.uTh, Math.tan(view.fov / 2)); gl.uniform1f(P.fog.u.uAspect, aspect);
    gl.uniform1f(P.fog.u.uYaw, view.yaw); gl.uniform1f(P.fog.u.uFQ, gfx.quality === "low" ? 0 : 1); gl.uniform3f(P.fog.u.uHalf, PW * 0.79, PH * 0.79, PD);
    drawFull(P.fog);

    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(P.main.p); var u = P.main.u;
    gl.uniform1f(u.uTime, t); gl.uniform1f(u.uDusk, dusk); gl.uniform1f(u.uNight, night);
    gl.uniformMatrix4fv(u.uMVP, false, new Float32Array(VP));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex); gl.uniform1i(u.uImg, 0);
    gl.uniform2f(u.uTexel, 1 / scene.tw, 1 / scene.th);
    gl.uniform1f(u.uHalo, fxNow.halo); gl.uniform1f(u.uSpark, fxNow.spark); gl.uniform1f(u.uWater, fxNow.water); gl.uniform1f(u.uLife, fxNow.life); gl.uniform1f(u.uRays, fxNow.rays);
    gl.uniform2f(u.uSun, SUN_PX[0], SUN_PX[1]);
    gl.uniform4fv(u.uLamp, scene.lampPos); gl.uniform3fv(u.uLampC, scene.lampCol); gl.uniform4fv(u.uSettle, scene.settleV);
    gl.uniform1f(u.uMain, scene.main); gl.uniform3fv(u.uPulse, scene.pulseV); gl.uniform4fv(u.uPetal, scene.petalV); gl.uniform4fv(u.uCenter, scene.center);
    stepReveal(scene, Math.min((now - lastReveal) / 1000, 0.25)); lastReveal = now; gl.uniform4fv(u.uFow, scene.fowV); gl.uniform1fv(u.uReveal, scene.reveal);
    gl.uniform1f(u.uYaw, view.yaw); gl.uniform1f(u.uFQ, gfx.quality === "low" ? 0 : 1);
    attrib(P.main.p, "aPos", mainPosBuf, 3); attrib(P.main.p, "aImg", mainImgBuf, 2);
    gl.drawArrays(gl.TRIANGLES, 0, 6); resetAttribs();

    if (fxNow.life > 0.01 && night < 0.99) {
      var nb = birdGeometry(t);
      gl.useProgram(P.bird.p);
      gl.uniformMatrix4fv(P.bird.u.uMVP, false, new Float32Array(VP));
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, birdTex); gl.uniform1i(P.bird.u.uBird, 1);
      gl.uniform1f(P.bird.u.uNight, night + (1 - fxNow.life)); gl.uniform1f(P.bird.u.uDusk, dusk);
      attrib(P.bird.p, "aPos", birdBuf, 3); attrib(P.bird.p, "aUv", birdUvBuf, 2); attrib(P.bird.p, "aAlpha", birdABuf, 1);
      gl.drawArrays(gl.TRIANGLES, 0, nb); resetAttribs();
    }
    gl.disable(gl.BLEND);

    gl.useProgram(P.bright.p); gl.bindFramebuffer(gl.FRAMEBUFFER, RT.a.fb); gl.viewport(0, 0, RT.a.w, RT.a.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.scene.tex); gl.uniform1i(P.bright.u.uTex, 0);
    gl.uniform2f(P.bright.u.uTexel, 1 / W, 1 / H); drawFull(P.bright);
    gl.useProgram(P.blur.p); gl.uniform1i(P.blur.u.uTex, 0);
    for (var pass = 0; pass < 2; pass++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, RT.b.fb); gl.bindTexture(gl.TEXTURE_2D, RT.a.tex); gl.uniform2f(P.blur.u.uDir, (1 + pass) / RT.a.w, 0); drawFull(P.blur);
      gl.bindFramebuffer(gl.FRAMEBUFFER, RT.a.fb); gl.bindTexture(gl.TEXTURE_2D, RT.b.tex); gl.uniform2f(P.blur.u.uDir, 0, (1 + pass) / RT.a.h); drawFull(P.blur);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    gl.useProgram(P.comp.p); var cu = P.comp.u;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.scene.tex); gl.uniform1i(cu.uScene, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, RT.a.tex); gl.uniform1i(cu.uBloom, 1);
    gl.uniform1f(cu.uBloomK, gfx.quality === "low" ? 0 : (0.16 - 0.06 * night) * (0.35 + 0.65 * fxNow.rays));
    gl.uniform1f(cu.uBright, gfx.bright / 100); gl.uniform1f(cu.uContrast, gfx.contrast / 100); gl.uniform1f(cu.uSat, gfx.sat / 100);
    gl.uniform1f(cu.uGrade, fxNow.grade); gl.uniform1f(cu.uTime, t); gl.uniform1f(cu.uDusk, dusk); gl.uniform1f(cu.uNight, night);
    var sp = project(VP, scale(SUN_DIR, PD * 3));
    var flare = sp[2] > 0 ? (1 - Math.min(1, Math.max(0, (Math.hypot(sp[0], sp[1]) - 0.9) / 0.8))) : 0;
    gl.uniform2f(cu.uSunScr, sp[0], sp[1]); gl.uniform1f(cu.uFlare, flare * fxNow.rays * fxNow.grade * (1 - night));
    gl.uniform2f(cu.uRes, W, H);
    drawFull(P.comp);
    if (!glChecked && ++glFrames >= 8) {
      glChecked = true;
      var px = new Uint8Array(4 * 9), sum = 0;
      for (var gy = 0; gy < 3; gy++) for (var gx = 0; gx < 3; gx++) { gl.readPixels(Math.round(W * (gx + 1) / 4), Math.round(H * (gy + 1) / 4), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px.subarray((gy * 3 + gx) * 4)); }
      for (var pi = 0; pi < px.length; pi += 4) sum += px[pi] + px[pi + 1] + px[pi + 2];
      if (sum < 30 || gl.isContextLost()) fallback("<b>這台電腦的顯示卡無法正確繪製 3D 特效</b>，先以靜態畫面顯示。<br>請確認瀏覽器已開啟「硬體加速」，或在效果設定把畫質調低後重新整理。");
      else canvas.classList.add("live");
    }
  }
  requestAnimationFrame(frame);

  window.__sample = {
    set: function (o) { Object.assign(cam, o); vel.yaw = vel.pitch = 0; lastInput = performance.now(); },
    state: function () { return { yaw: cam.yaw / D2R, pitch: cam.pitch / D2R, fov: cam.fov / D2R, home: HOME_FOV / D2R }; },
    area: function (id) { flyToArea(AREAS.filter(function (x) { return x.id === id; })[0]); },
    time: function (m) { timeMode = m; dusk = m === "dusk" ? 1 : 0; night = m === "night" ? 1 : 0; },
    ready: function () { return !!scene.tex && !warping; },
    enter: function (id) { switchScene(id || "gate", null); },
    back: function () { switchScene("main", null); },
    station: function (n) { flyToArea(scene.items.filter(function (x) { return x.num === n; })[0]); },
    scene: function () { return scene.id; },
    corners: function () { return [[0, 0], [IMG_W, 0], [0, IMG_H], [IMG_W, IMG_H]].map(function (q) { var p = toScreen(lastVP, q[0], q[1]); return [Math.round(p[0]), Math.round(p[1])]; }); }
  };

  function fallback(msg) { var old = document.querySelector(".fallback"); if (old) old.remove(); var dv = document.createElement("div"); dv.className = "fallback"; dv.setAttribute("role", "alert"); dv.innerHTML = msg; document.body.appendChild(dv); canvas.classList.remove("live"); document.getElementById("plates").style.display = "none"; }
})();
</script>

</body>
